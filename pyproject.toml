[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "cinder"
version = "0.1.0-dev"
description = "CINDER — Co-occurrence INference for Disease Escalation in Rheumatology. Open analysis pipeline for the FORWARD-registry validation study."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Andras Hangyal", email = "andras@2ndopinionmd.com" },
    { name = "Dylan McCapes", email = "dylan@2ndopinionmd.com" },
]
keywords = [
    "rheumatology",
    "rheumatoid-arthritis",
    "bayesian",
    "uncertainty-quantification",
    "patient-reported-outcomes",
    "FORWARD-registry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pymc>=5.10",
    "arviz>=0.17",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "types-jsonschema",
]
sampling = [
    "nutpie>=0.13",  # Optional faster NUTS sampler for §4.8 hierarchical model
]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/2OPMD/cinder-study"
Repository = "https://github.com/2OPMD/cinder-study"
Issues = "https://github.com/2OPMD/cinder-study/issues"

[tool.hatch.build.targets.wheel]
packages = ["cinder"]

# --------------------------------------------------------------------------- #
# Ruff — formatter + linter
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "fixtures",
    "**/*.ipynb_checkpoints",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "N",    # naming
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "N806",  # allow uppercase locals (Bayesian model variables: H, E, K, etc.)
    "N803",  # allow uppercase args (same reason)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"analysis/**" = ["N802"]  # statistical convention names (e.g. PPV, NPV)

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "cinder", "analysis"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "regression: marks tests as MVP-vendor-layer regression checks",
    "integration: marks tests requiring full pipeline run",
]

# --------------------------------------------------------------------------- #
# Mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
ignore_missing_imports = false
exclude = [
    "fixtures/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = [
    "pymc.*",
    "arviz.*",
    "scipy.*",
    "nutpie.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
source = ["cinder", "analysis"]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 80
